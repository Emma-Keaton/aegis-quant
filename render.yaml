services:
  # Aegis Quant - single all-in-one web service (API + engines + market + trending)
  - type: web
    name: aegis-quant-api
    env: python
    region: oregon
    plan: starter
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      # Runtime
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: AEGIS_ROLE
        value: all
      - key: ENVIRONMENT
        value: production
      # Database
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: REDIS_URL
        sync: false
      # Secrets
      - key: SESSION_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        sync: false
      # Telegram bot (webhook / Mini App)
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        value: aegisquantbot
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: ADMIN_CHAT_ID
        sync: false
      - key: APP_URL
        value: https://aegis-quant.vercel.app
      - key: API_PUBLIC_URL
        fromService:
          name: aegis-quant-api
          type: web
          envVarName: RENDER_EXTERNAL_URL
      - key: CORS_ORIGINS
        value: https://aegis-quant.vercel.app
      # Telegram MTProto (Telethon private-channel polling - worker functions)
      - key: TELEGRAM_API_ID
        sync: false
      - key: TELEGRAM_API_HASH
        sync: false
      - key: TELEGRAM_PHONE
        sync: false
      # AI / LLM
      - key: GEMINI_API_KEY_1
        sync: false
      - key: GEMINI_API_KEY_2
        sync: false
      - key: GEMINI_API_KEY_3
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: qwen/qwen3.8-27b
      # Market data / trending
      - key: CMC_API_KEY
        sync: false
      - key: RAYDIUM_RPC_URL
        value: https://api.mainnet-beta.solana.com
      - key: TRENDING_POLL_SECONDS
        value: "300"
      # Execution
      - key: SOLANA_RPC_URL
        value: https://api.mainnet-beta.solana.com
      - key: SOLANA_PRIVATE_KEY
        sync: false
      - key: WALLET_CONNECT_PROJECT_ID
        sync: false
      - key: AUTO_CONFIDENCE_THRESHOLD
        value: "75"
      # Other
      - key: GRAFANA_URL
        sync: false
      # Kronos prediction service. Now hosted on Modal, not Render: the previous
      # `aegis-quant-kronos` Render service never loaded the model
      # (KRONOS_LOAD_MODEL=0) and returned a straight-line placeholder. It has
      # been removed rather than left to answer with fabricated forecasts.
      - key: KRONOS_SERVICE_URL
        sync: false
      - key: KRONOS_API_KEY
        sync: false
      # Market watch (dexscreener + Helius whale flows). Whale watch stays
      # disabled without a key — the job is never scheduled.
      - key: HELIUS_API_KEY
        sync: false
      - key: DEX_WATCH_ENABLED
        value: "true"
      - key: WHALE_WATCH_ENABLED
        value: "true"
      # Live-safety gates. Live orders are refused until BOTH of these are
      # flipped AND the promotion gate has certified the profile:
      #   LIVE_TRADING_ENABLED=false  → master switch (default off)
      #   REQUIRE_PROMOTION_FOR_LIVE  → paper→live promotion gate (default on)
      - key: LIVE_TRADING_ENABLED
        value: "false"
      - key: REQUIRE_PROMOTION_FOR_LIVE
        value: "true"
      - key: PROMOTION_ENABLED
        value: "true"
