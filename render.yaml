services:
  # Aegis Quant - single all-in-one web service (API + engines + market + trending)
  - type: web
    name: aegis-quant-api
    env: python
    region: oregon
    plan: starter
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      # Runtime
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: AEGIS_ROLE
        value: all
      - key: ENVIRONMENT
        value: production
      # Database
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: REDIS_URL
        sync: false
      # Secrets
      - key: SESSION_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        sync: false
      # Telegram bot (webhook / Mini App)
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        value: aegisquantbot
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: ADMIN_CHAT_ID
        sync: false
      - key: APP_URL
        value: https://aegis-quant.vercel.app
      - key: API_PUBLIC_URL
        fromService:
          name: aegis-quant-api
          type: web
          envVarName: RENDER_EXTERNAL_URL
      - key: CORS_ORIGINS
        value: https://aegis-quant.vercel.app
      # Telegram MTProto (Telethon private-channel polling - worker functions)
      - key: TELEGRAM_API_ID
        sync: false
      - key: TELEGRAM_API_HASH
        sync: false
      - key: TELEGRAM_PHONE
        sync: false
      # AI / LLM
      - key: GEMINI_API_KEY_1
        sync: false
      - key: GEMINI_API_KEY_2
        sync: false
      - key: GEMINI_API_KEY_3
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      # Market data / trending
      - key: CMC_API_KEY
        sync: false
      - key: RAYDIUM_RPC_URL
        value: https://api.mainnet-beta.solana.com
      - key: TRENDING_POLL_SECONDS
        value: "300"
      # Execution
      - key: SOLANA_RPC_URL
        value: https://api.mainnet-beta.solana.com
      - key: SOLANA_PRIVATE_KEY
        sync: false
      - key: WALLET_CONNECT_PROJECT_ID
        sync: false
      - key: AUTO_CONFIDENCE_THRESHOLD
        value: "75"
      # Other
      - key: GRAFANA_URL
        sync: false
      - key: KRONOS_SERVICE_URL
        fromService:
          name: aegis-quant-kronos
          type: web
          envVarName: RENDER_EXTERNAL_URL
        sync: false

  # Kronos (AI forecasting, deployed separately)
  - type: web
    name: aegis-quant-kronos
    env: python
    region: oregon
    plan: starter
    buildCommand: cd kronos && pip install -r requirements.txt
    startCommand: cd kronos && uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: ENVIRONMENT
        value: production
      # Set KRONOS_LOAD_MODEL=1 + add kronos lib/torch to enable real inference (needs GPU)
      - key: KRONOS_LOAD_MODEL
        value: "0"
        sync: false
