services:
  - type: web
    name: kronos-ai
    env: python
    region: oregon
    plan: free
    buildCommand: |
      pip install torch --index-url https://download.pytorch.org/whl/cpu
      pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTORCH_CPU_ONLY
        value: "1"
      - key: KRONOS_API_KEY
        generateValue: true
      - key: LOG_LEVEL
        value: INFO
    healthCheckPath: /health
    autoDeploy: true