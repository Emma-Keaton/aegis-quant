name: bull_trend
display_name: Default Bull Trend
description: Default stock analysis strategy prioritizing uptrends, trend continuation, and pullback entries.
category: trend
core_rules: [1, 2, 3]
required_tools:
  - get_daily_history
  - analyze_trend
aliases: [trend, trend analysis, bullish trend]
default_active: true
default_router: true
default_priority: 10
market_regimes: [trending_up]
instructions: |
  **Default Bull Trend Strategy**

  Use case:
  - Default strategy for regular stock analysis.
  - Prioritize finding "uptrend + controllable risk + no chase" opportunities.

  Analysis Framework:

  1. **Trend Confirmation (Highest Priority)**
     - Use `analyze_trend` to check MA5/MA10/MA20排列.
     - MA5 >= MA10 >= MA20 with upward MA20 slope indicates bullish structure.
     - If price significantly breaks below MA20, reduce bullish weight.

  2. **Position & Rhythm**
     - Prioritize "pullback holds" over "chasing highs".
     - When price is too far from MA5/MA10, suggest waiting for pullback.
     - Volume breakout through resistance increases win rate rating.

  3. **Volume-Price Validation**
     - Use `get_daily_history` to check if breakout/rebound days show volume confirmation.
     - Shrinking volume on rise needs caution; rising volume with stalled price warns of divergence.

  4. **Trade Recommendation Output**
     - Output clear "buy/wait/reduce"倾向 with trigger conditions.
     - Must provide stop loss reference (e.g., below MA20 or structural low).
     - If no clear advantage, explicitly state "stand aside" to avoid overtrading.

  Scoring Adjustments:
  - Bullish alignment + strong trend: sentiment_score +12
  - Pullback holding key moving average: sentiment_score +8
  - Volume breakout through key resistance: sentiment_score +10
  - Breaking below MA20 or trend weakening: sentiment_score -12
