name: bottom_volume
display_name: Bottom Volume Breakout
description: Identifies high-volume breakouts at price bottoms as buy signals.
category: reversal
core_rules: [1, 3, 5]
required_tools:
  - get_daily_history
aliases: [bottom volume, volume breakout, reversal]
default_active: true
default_router: false
default_priority: 30
market_regimes: [oversold]
instructions: |
  **Bottom Volume Breakout Strategy**

  1. **Identify Bottom**: Use `get_daily_history` to locate the lowest price point over the last N days.
  2. **Volume Surge Condition**: The volume on the day of the lowest price must exceed 1.5x the average volume of the preceding 10 days.
  3. **Buy Trigger**: If the volume surge condition is met AND price recovers within 2% above the low, generate a buy signal.
  4. **Stop Loss**: Place stop loss 3% below the identified low.

  Scoring:
  - Volume > 2x AND successful retest: sentiment_score +12
  - Volume 1.5-2x only: sentiment_score +6
  - Volume condition failed OR retest failed: sentiment_score -8
