name: bottom_volume
display_name: 底部放量
description: 底部放量策略 – 在价格底部出现放量突破，触发买入信号。
category: reversal
core_rules: [1, 3, 5]
required_tools:
  - get_daily_history
aliases: [底部放量]
default_active: true
default_router: false
default_priority: 30
market_regimes: [oversold]
instructions: |
  **底部放量（Bottom Volume Strategy）**

  1. **底部识别**：使用 `get_daily_history` 查找最近 N 天内的最低价。
  2. **放量条件**：在该最低价当天的成交量必须大于过去 10 天平均成交量的 1.5 倍。
  3. **买入触发**：若满足放量条件且价格回升至最低价上方 2% 以内，发出买入信号。
  4. **止损**：止损设置在最低价以下 3%。

  评分：
  - 放量 > 2 倍且价格回踩成功：sentiment_score +12
  - 放量仅 1.5‑2 倍：sentiment_score +6
  - 未满足放量或回踩失败：sentiment_score -8
