name: event_driven
display_name: Event-Driven
description: Trading signals based on news, social media, or on-chain events.
category: framework
core_rules: [5, 6]
required_tools:
  - search_stock_news
  - get_daily_history
aliases: [event, news-driven]
default_active: true
default_router: true
default_priority: 15
market_regimes: [event]
instructions: |
  **Event-Driven Strategy**

  1. **Event Collection**: Use `search_stock_news` to retrieve crypto news, on-chain governance proposals, or major community votes from the last 24 hours.
  2. **Sentiment Analysis**: Perform sentiment analysis on headlines and summaries (positive/negative) and map results to a 0-100 numerical score.
  3. **Price Verification**: Use `get_daily_history` to check if the corresponding token price has moved significantly (>3%) in the past 1 hour.
  4. **Signal Generation**: If sentiment score >= 70 AND price movement condition is met, generate buy signal; if sentiment score <= 30, generate sell signal.

  Scoring Adjustments:
  - Positive high sentiment + large price increase: sentiment_score +15
  - Negative high sentiment + large price drop: sentiment_score -15
  - Neutral or low sentiment: sentiment_score +/- 0
