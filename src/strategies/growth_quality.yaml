name: growth_quality
display_name: Growth & Quality
description: Screens for high-quality growth tokens via revenue growth, ROE, and volume-price confirmation.
category: quality
core_rules: [4, 6, 7]
required_tools:
  - get_daily_history
  - analyze_trend
aliases: [growth, quality]
default_active: true
default_router: false
default_priority: 25
market_regimes: [growth]
instructions: |
  **Growth & Quality Strategy**

  1. **Fundamental Screen**: Screen for tokens with market cap $1-10B, requiring month-over-month revenue (or on-chain volume) growth >= 20% over the last 3 months.
  2. **Quality Filter**: ROE ( or on-chain equivalent metric) >= 15%.
  3. **Price-Volume Alignment**: Use `get_daily_history` to verify that 7-day volume exceeds 1.3x the 10-day average volume AND no significant drawdown (>5%) has occurred.
  4. **Entry Timing**: If all conditions are met, enter at current price after a volume-backed pullback, with stop loss set below 4%.

  Scoring Adjustments:
  - Fully meets all conditions: sentiment_score +18
  - Missing quality metric but meets growth and volume-price: sentiment_score +10
  - Only meets growth metrics: sentiment_score +6
