name: ma_golden_cross
display_name: MA Golden Cross
description: Detects moving average golden cross配合 volume confirmation — classic trend reversal/continuation signal.
category: trend
core_rules: [1, 2, 3]
required_tools:
  - get_daily_history
  - analyze_trend
aliases: [ma cross, golden cross]
default_active: true
default_router: false
default_priority: 20
market_regimes: [trending_up]
instructions: |
  **MA Golden Cross Strategy**

  Signal Criteria:

  1. **Golden Cross Detection** (linked to principle 2: trend trading):
     - Use `analyze_trend` to check MA排列 and MACD status.
     - Primary signal: MA5 crosses above MA10 within the last 3 trading periods.
     - Strong signal: MA10 crosses above MA20 (slower but more reliable).
     - Check if MACD shows golden cross or is above zero axis.

  2. **Volume Confirmation** (linked to principle 3: efficiency first):
     - Golden cross day volume should exceed 5-day average volume.
     - Verify using `get_daily_history`.
     - Volume ratio > 1.2 on golden cross day is positive signal.

  3. **Trend Context**:
     - Consolidation breakout golden cross: strongest signal.
     - Golden cross during uptrend: continuation signal.
     - Golden cross during deep decline: weak signal, needs more confirmation.

  4. **Price Position** (linked to principle 1: strict entry):
     - Price should be near or above the crossing MAs.
     - Bias < 5% — avoid chasing late entries.

  Scoring Adjustments:
  - MA5 x MA10 golden cross with volume: sentiment_score +10
  - MA10 x MA20 golden cross: sentiment_score +8
  - MACD zero-axis golden cross: additional +5
  - Note "golden cross" in `ma_analysis` and `buy_reason`.
  - Ideal entry near the crossing MA level.
