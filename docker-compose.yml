version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: aegis-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: aegis_quant
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: aegis-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aegis-backend
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/aegis_quant
      - REDIS_URL=redis://redis:6379/0
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_BOT_USERNAME=${TELEGRAM_BOT_USERNAME}
      - APP_URL=http://localhost:8000
      - KRONOS_API_URL=http://host.docker.internal:8001
      - KRONOS_API_KEY=${KRONOS_API_KEY}
      - GEMINI_API_KEY_1=${GEMINI_API_KEY_1}
      - GEMINI_API_KEY_2=${GEMINI_API_KEY_2}
      - GEMINI_API_KEY_3=${GEMINI_API_KEY_3}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - BYBIT_API_KEY=${BYBIT_API_KEY}
      - BYBIT_API_SECRET=${BYBIT_API_SECRET}
      - OKX_API_KEY=${OKX_API_KEY}
      - OKX_API_SECRET=${OKX_API_SECRET}
      - OKX_PASSPHRASE=${OKX_PASSPHRASE}
      - ENGINE_A_PRICE_CHANGE_THRESHOLD=0.02
      - ENGINE_A_VOLUME_SPIKE_THRESHOLD=3.0
      - ENGINE_A_SPREAD_BPS_THRESHOLD=10
      - ENGINE_A_FUNDING_FLIP_ENABLED=true
      - ENGINE_A_MIN_CONFIDENCE=0.70
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # ── QuantDinger service (AI‑automated trading backend) ────────────────────────
  # NOTE: When deploying to Render, set the following env vars in the Render service settings:
  #   QUANTDINGER_DATABASE_URL – PostgreSQL connection string for QuantDinger (e.g. postgres://user:pass@host:5432/quantdinger)
  #   QUANTDINGER_SECRET_KEY   – Secure random secret (generate with `openssl rand -hex 32`)
  #   QUANTDINGER_AGENT_TOKEN  – Agent token (create via QuantDinger admin UI; see README)
  quantdinger:
    image: ghcr.io/brokermr810/quantdinger-backend:latest
    container_name: quantdinger-backend
    environment:
      - DATABASE_URL=${QUANTDINGER_DATABASE_URL}
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${QUANTDINGER_SECRET_KEY}
      - AGENT_TOKEN=${QUANTDINGER_AGENT_TOKEN}
    ports:
      - "5001:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - default

volumes:
  postgres_data:
  redis_data: